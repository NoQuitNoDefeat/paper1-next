# E19（探索，2026-10-05，不替代定稿配置）：每次迭代 4 倍的同策略数据，梯度步数不变。
# PPO 用 32 个环境（定稿为 8），每次迭代 4096 个周期；小批量放大到 1024 个周期，
# 所以每轮仍是 4 个小批量、每次迭代仍是 16 个梯度步，只是每步的样本是 4 倍，梯度噪声约降为 1/4。
# 模仿预热仍用 8 个环境，数据与起点和定稿方法逐位相同。其余（迭代数、学习率、选检查点）不变。
extends = "../protocol_final.toml"
name = "e19-data4x"

[training]
num_envs = 32

[trainer]
minibatch_cycles = 1024

[imitation]
num_envs = 8
