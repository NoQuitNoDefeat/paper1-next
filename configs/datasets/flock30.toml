# 群集 30：Vásárhelyi 等 2018 的 30 架真实群集飞行轨迹（Zenodo 4983910，CC0）。
# 轨迹文件由 tools/data/build_vasarhelyi.py 生成到 data/processed/vasarhelyi2018/（不进 git）。
# 只有轨迹来自实测；业务、信道、执行由模型补齐（docs/data-screening.md 第 7 节）。
# 划分按整次飞行；E13 的规格会覆盖 train / dev / test。
extends = "../protocol_final.toml"
name = "flock30"

[scenario]
type = "trace"
dir = "data/processed/vasarhelyi2018"
train = ["4mps_diagonal", "6mps_circular", "8mps_circular"]
dev = ["6mps_obstacles"]
test = []
num_nodes = 16
flow_rate_pps = [10.0, 30.0]
cycle_length = 0.02
horizon = 500
packet_size = 1024
queue_capacity = 64
waiting_capacity = 16
waiting_max_wait = 1.0

[scenario.radio]
tx_power_dbm = 20.0
noise_dbm = -80.0
pathloss_ref_db = 40.05
pathloss_exponent = 2.5
sinr_threshold_db = 4.771212547196624
rate_bps = 4e6
service_window_s = 0.02
